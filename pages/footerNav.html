<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/footerNav.css">
    <title>Document</title>
</head>
<body>
    <footer class="mobile-footer">
        <nav class="menu-footer">
            <a href="./accueil.php" class="menu-item" onclick="activateIcon(this, 'home')">
                <img src="../icons/home.png" alt="Home Icon" id="homeIcon">
            </a>
            <a href="#" class="menu-item" onclick="activateIcon(this, 'clock')">
                <img src="../icons/recent.png" alt="Clock Icon" id="clockIcon">
            </a>
            <a href="#" class="menu-item" onclick="activateIcon(this, 'bell')">
                <img src="../icons/notification.png" alt="Bell Icon" id="bellIcon">
            </a>
            <a href="./connexion.php" class="menu-item" onclick="activateIcon(this, 'profile', 'profileActive', 'profilePage.html')">
                <img src="../icons/profil.png" alt="Profile Icon" id="profileIcon">
            </a>
        </nav>
    </footer>
    
    <script>
        // Fonction pour gérer le changement d'icône et la redirection
        function activateIcon(element, iconId, activeIconId = null, redirectUrl = null) {
            // Réinitialise toutes les icônes à leur état normal (non actives)
            document.querySelectorAll('.menu-item img').forEach(img => {
                img.src = img.src.replace('Active.png', '.png'); // Remet l'icône inactive
            });
            
            // Change l'icône actuelle pour l'icône active
            let icon = document.getElementById(iconId + 'Icon');
            icon.src = `../icons/${iconId}Active.png`; // Utilise l'icône active

            // Supprime la classe 'active' de tous les éléments du menu
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });

            // Ajoute la classe 'active' à l'élément cliqué
            element.classList.add('active');

            
        }
    </script>
</body>
</html>
